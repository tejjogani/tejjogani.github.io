<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween Game Night</title>
<style>
:root{
  --night:#110c14;--card:#1c1520;--card2:#251c2a;--line:#33283a;
  --bone:#efe6cf;--dim:#9a8f86;--pumpkin:#ff7518;--pumpkin-dk:#b84d05;
  --slime:#a5d63a;--blood:#e0403a;--witch:#8e5cc4;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--bone);background:var(--night);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#home,#tv,#control{display:none}
body.mode-home #home{display:grid}
body.mode-tv #tv{display:block}
body.mode-control #control{display:block}

/* Shared "cut paper" button */
.btn{padding:11px 18px;border-radius:10px;font-weight:700;font-size:16px;background:var(--card2);
  border:2px solid var(--line);box-shadow:3px 3px 0 #000;transition:transform .06s,box-shadow .06s}
.btn:hover:not(:disabled){border-color:#4a3c52}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 #000}
.btn:disabled{opacity:.35;cursor:default}
.btn.orange{background:var(--pumpkin);border-color:var(--pumpkin-dk);color:#1a0d02}
.btn.blood{background:var(--blood);border-color:#8e1f1b;color:#fff}

/* ---------- Home ---------- */
#home{min-height:100vh;place-items:center;text-align:center;padding:40px 20px}
#home h1{font-family:var(--serif);font-size:clamp(36px,6vw,68px);font-weight:700;letter-spacing:.02em;margin-bottom:10px}
#home h1 span{color:var(--pumpkin)}
#home p{color:var(--dim);font-size:18px;margin-bottom:34px}
.home-btns{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.home-btns .btn{padding:24px 34px;font-size:22px;min-width:250px;box-shadow:5px 5px 0 #000}
.home-btns .btn small{display:block;font-size:14px;font-weight:600;opacity:.75;margin-top:6px}

/* ---------- TV ---------- */
#tv{height:100vh;overflow:hidden;padding:3vh 4vw 0;position:relative;
  background:radial-gradient(ellipse at 50% 120%,#24122c 0%,transparent 60%),var(--night)}
.moon{position:absolute;top:-9vh;right:6vw;width:26vh;height:26vh;border-radius:50%;
  background:radial-gradient(circle at 35% 40%,rgba(0,0,0,.07) 0 9%,transparent 10%),
             radial-gradient(circle at 62% 66%,rgba(0,0,0,.06) 0 6%,transparent 7%),
             radial-gradient(circle at 70% 30%,rgba(0,0,0,.05) 0 4%,transparent 5%),#e9dfc0;
  box-shadow:0 0 12vh rgba(233,223,192,.12);opacity:.9}
.deco-bat{position:absolute;fill:#000;opacity:.85}
#tv header{position:relative;height:10vh;display:flex;align-items:center;gap:1.5vw}
#tv h1{font-family:var(--serif);font-size:6.4vh;font-weight:700;letter-spacing:.02em;line-height:1}
#tv h1 span{color:var(--pumpkin)}
#board{position:relative;height:83vh;display:flex;flex-direction:column;gap:var(--gap,1.6vh);padding-top:1vh}
.row{
  position:relative;flex:none;height:var(--rowh,12vh);
  display:flex;align-items:center;gap:2.4vw;padding:0 3vw 0 1.6vw;
  border-radius:1.4vh;background:var(--card);border:.35vh solid var(--line);
  box-shadow:.7vh .7vh 0 #000;
  transition:transform .85s cubic-bezier(.2,.9,.25,1),opacity .6s ease,background .5s,border-color .5s;
  will-change:transform;
}
.row::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:rgba(165,214,58,.28)}
.row.flash-neg::after{background:rgba(224,64,58,.3)}
.row.flash::after{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
/* rank sits on a little tombstone */
.rank{flex:none;width:calc(var(--rowh,12vh)*.78);height:calc(var(--rowh,12vh)*.8);
  display:grid;place-items:center;padding-top:calc(var(--rowh,12vh)*.07);line-height:1;
  border-radius:50% 50% .8vh .8vh/38% 38% .8vh .8vh;background:#3b3440;color:#cfc6b4;
  font-family:var(--serif);font-size:calc(var(--rowh,12vh)*.42);font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.row[data-rank="1"] .rank{background:var(--pumpkin);color:#1a0d02}
.name{flex:1;min-width:0;font-size:calc(var(--rowh,12vh)*.46);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lantern{display:none;margin-right:.25em}
.row.leader .lantern{display:inline-block;animation:wobble 2.2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.score{position:relative;flex:none;font-size:calc(var(--rowh,12vh)*.62);font-weight:900;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.sv{display:inline-block}
.sv.bump{animation:bump .55s cubic-bezier(.2,.9,.25,1.4)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
.row.leader{background:#2a1608;border-color:var(--pumpkin);animation:candle 3s infinite}
.row.leader .score{color:var(--pumpkin)}
/* irregular flicker, like a candle inside a pumpkin */
@keyframes candle{
  0%,100%{box-shadow:.7vh .7vh 0 #000,0 0 3vh rgba(255,117,24,.35)}
  12%{box-shadow:.7vh .7vh 0 #000,0 0 5vh rgba(255,117,24,.55)}
  19%{box-shadow:.7vh .7vh 0 #000,0 0 2.5vh rgba(255,117,24,.3)}
  33%{box-shadow:.7vh .7vh 0 #000,0 0 4.5vh rgba(255,117,24,.5)}
  58%{box-shadow:.7vh .7vh 0 #000,0 0 3vh rgba(255,117,24,.38)}
  64%{box-shadow:.7vh .7vh 0 #000,0 0 6vh rgba(255,117,24,.6)}
  80%{box-shadow:.7vh .7vh 0 #000,0 0 3.5vh rgba(255,117,24,.42)}
}
.tdot{display:none;width:.55em;height:.55em;border-radius:50%;margin-right:.35em;vertical-align:middle;border:.3vh solid #000}
.tdot.show{display:inline-block}
.pop{position:absolute;right:calc(100% + .25em);top:0;font-size:.8em;font-weight:900;white-space:nowrap;
  color:var(--slime);text-shadow:.4vh .4vh 0 #000;pointer-events:none;animation:pop 1.5s ease-out forwards}
.pop.neg{color:var(--blood)}
@keyframes pop{
  0%{opacity:0;transform:translateY(40%) scale(.4)}
  15%{opacity:1;transform:translateY(-10%) scale(1.3)}
  30%{transform:translateY(-20%) scale(1)}
  100%{opacity:0;transform:translateY(-120%) scale(1)}
}
#tvEmpty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-size:5vh;color:var(--dim);padding:0 10vw}
#tvEmpty[hidden]{display:none}
#celebrate{position:fixed;inset:0;pointer-events:none;z-index:5;display:grid;place-items:center;overflow:hidden}
.banner{max-width:86vw;text-align:center;font-family:var(--serif);font-size:10vh;font-weight:700;line-height:1.1;overflow-wrap:anywhere;
  padding:3vh 5vw 4vh;border-radius:2vh;background:var(--bone);color:#140d10;border:.6vh solid #000;
  box-shadow:1.4vh 1.4vh 0 #000;animation:banner 3.4s cubic-bezier(.2,.9,.25,1) forwards}
.banner small{display:block;font-family:var(--sans);font-size:3.6vh;font-weight:900;color:var(--pumpkin-dk);letter-spacing:.25em;text-transform:uppercase;margin-bottom:1vh}
@keyframes banner{
  0%{opacity:0;transform:scale(.3) rotate(-6deg)}
  12%{opacity:1;transform:scale(1.06) rotate(-1deg)}
  20%{transform:scale(1) rotate(-1.5deg)}
  85%{opacity:1;transform:scale(1) rotate(-1.5deg)}
  100%{opacity:0;transform:scale(1.05) rotate(-1.5deg)}
}
.flybat{position:absolute;left:0;top:0;fill:#0a070c;animation:fly linear forwards}
.flybat svg{display:block;width:100%;height:auto;animation:flap .18s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(var(--x0),var(--y0))}to{transform:translate(var(--x1),var(--y1))}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
#fsBtn{position:fixed;top:2vh;right:2vw;z-index:10;transition:opacity .5s}
body.idle #fsBtn{opacity:0;pointer-events:none}
body.idle.mode-tv{cursor:none}

/* ---------- Control ---------- */
#control{max-width:920px;margin:0 auto;padding:22px 20px 80px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{font-family:var(--serif);font-size:30px;font-weight:700;flex:1;min-width:200px}
.topbar h1 span{color:var(--pumpkin)}
.status{font-size:14px;font-weight:700;color:var(--dim);padding:7px 12px;border-radius:8px;border:2px dashed var(--line)}
.status.on{color:var(--slime);border-color:#4e6620}
#undoBtn{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:150px}
#undoLbl{font-size:12px;font-weight:600;opacity:.7;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:8px;margin-bottom:8px}
.seg button{flex:1;padding:14px;border-radius:10px;font-size:18px;font-weight:800;color:var(--dim);
  background:var(--card);border:2px solid var(--line)}
.seg button.on{background:var(--bone);color:#140d10;border-color:var(--bone);box-shadow:3px 3px 0 #000}
.modehint{color:var(--dim);font-size:14px;margin:4px 2px 16px}
.add{display:flex;gap:10px;margin-bottom:16px}
.add input{flex:1;min-width:0}
input.text{font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:2px solid var(--line);
  background:#0c080e;color:var(--bone);outline:none}
input.text:focus{border-color:var(--pumpkin)}
.player{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:10px 12px 10px 14px;
  border-radius:12px;background:var(--card);border:2px solid var(--line);margin-bottom:10px}
.pname{display:flex;align-items:center;gap:10px;min-width:0}
.prank{flex:none;font-size:13px;font-weight:800;color:var(--dim);background:var(--card2);padding:4px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.prank.first{color:#1a0d02;background:var(--pumpkin)}
input.name-in{width:100%;min-width:0;font-weight:800;font-size:20px;background:transparent;border-color:transparent}
input.name-in:hover{border-color:var(--line)}
input.name-in:focus{background:#0c080e;border-color:var(--pumpkin)}
.pscore{font-size:34px;font-weight:900;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.pscore.bump{animation:bump .4s ease-out}
.pbtns{display:flex;gap:8px;align-items:center}
.minus{width:54px;height:58px;border-radius:10px;font-size:18px;font-weight:800;color:var(--dim);background:var(--card2);border:2px solid var(--line)}
.minus:hover{color:var(--blood)}
.minus:active{transform:scale(.94)}
.win{height:58px;min-width:140px;padding:0 18px;font-size:19px;font-weight:900}
.chips{display:flex;gap:6px}
.chip{min-width:64px;height:52px;padding:0 8px;border-radius:10px;border:2px solid #000;opacity:.3;font-weight:800;font-size:13px;color:#140d10;transition:opacity .1s}
.chip:hover{opacity:.6}
.chip.on{opacity:1;box-shadow:3px 3px 0 #000;outline:2px solid var(--bone);outline-offset:1px}
.chip.out{background:var(--card2);color:var(--bone);border-color:var(--line)}
.rm{width:40px;height:58px;border-radius:10px;color:var(--dim);font-size:20px}
.rm:hover{color:var(--blood)}
.teampanel{margin-top:14px;padding:16px;border-radius:12px;border:2px dashed var(--line)}
.teamtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;font-weight:700}
.btn.tc.on{background:var(--bone);color:#140d10;border-color:var(--bone)}
.teampanel h2{font-family:var(--serif);font-size:22px;margin-bottom:10px}
.winbtns{display:flex;flex-direction:column;gap:10px}
.winbtn{display:flex;align-items:baseline;gap:14px;padding:16px 18px;border-radius:12px;font-size:22px;font-weight:900;color:#140d10;text-align:left;
  border:2px solid #000;box-shadow:4px 4px 0 #000;transition:transform .06s,box-shadow .06s}
.winbtn:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 #000}
.winbtn:disabled{opacity:.3;cursor:default}
.winbtn small{font-size:15px;font-weight:700;opacity:.8}
#emptyC{color:var(--dim);text-align:center;padding:36px 0;font-size:18px}
.footer{margin-top:26px;padding-top:18px;border-top:2px dashed var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;border:2px solid var(--blood);background:#2a1214}
.confirm[hidden],#resetBtn[hidden]{display:none}
.confirm span{font-weight:700}
@media (max-width:640px){
  .player{grid-template-columns:1fr auto}
  .pbtns{grid-column:1/-1;justify-content:space-between;flex-wrap:wrap}
  .win{flex:1}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="bat" viewBox="0 0 100 50">
    <path d="M50 17c-2-5-5-6-7-2-5-6-15-9-28-7 7 4 9 10 7 16-5-3-12-3-18 0 10 3 16 10 18 18 6-6 14-8 20-5 2-4 5-6 8-3 3-3 6-1 8 3 6-3 14-1 20 5 2-8 8-15 18-18-6-3-13-3-18 0-2-6 0-12 7-16-13-2-23 1-28 7-2-4-5-3-7 2z"/>
  </symbol>
</svg>

<!-- ============ HOME ============ -->
<section id="home">
  <div>
    <h1><span>Halloween</span> Game Night</h1>
    <p>Open the TV window, drag it onto the TV, and keep this window as your scorekeeper.</p>
    <div class="home-btns">
      <button class="btn orange" id="openTv">Open TV window<small>new window for the TV</small></button>
      <button class="btn" id="openControl">Open scorekeeper<small>uses this window</small></button>
    </div>
  </div>
</section>

<!-- ============ TV ============ -->
<section id="tv">
  <div class="moon"></div>
  <svg class="deco-bat" style="top:13vh;right:4vw;width:7vh"><use href="#bat"/></svg>
  <svg class="deco-bat" style="top:5vh;right:24vw;width:4.5vh;transform:rotate(-12deg)"><use href="#bat"/></svg>
  <button class="btn" id="fsBtn">Fullscreen</button>
  <header><h1><span>Halloween</span> Game Night</h1></header>
  <div id="board"></div>
  <div id="tvEmpty">Nobody here yet…<br>add players on the scorekeeper</div>
  <div id="celebrate"></div>
</section>

<!-- ============ CONTROL ============ -->
<section id="control">
  <div class="topbar">
    <h1><span>Score</span>keeper</h1>
    <span class="status" id="tvStatus">TV not detected</span>
    <button class="btn" id="openTv2">Open TV window</button>
    <button class="btn" id="undoBtn" disabled><span>Undo</span><span id="undoLbl">nothing to undo</span></button>
  </div>
  <div class="seg" id="modeSeg">
    <button data-mode="solo">Individual round</button>
    <button data-mode="team">Team round</button>
  </div>
  <p class="modehint" id="modeHint"></p>
  <form class="add" id="addForm" autocomplete="off">
    <input class="text" id="newName" maxlength="30" placeholder="Add a player">
    <button class="btn orange" type="submit">Add</button>
  </form>
  <div id="plist"></div>
  <div id="emptyC">No players yet.</div>
  <div class="teampanel" id="teamPanel">
    <div class="teamtools">
      <span>Number of teams:</span>
      <button class="btn tc" data-n="2">2</button>
      <button class="btn tc" data-n="3">3</button>
      <button class="btn tc" data-n="4">4</button>
      <button class="btn" id="shuffleBtn">Shuffle teams</button>
    </div>
    <h2>Who won?</h2>
    <div class="winbtns" id="winBtns"></div>
  </div>
  <div class="footer">
    <button class="btn" id="resetBtn">Reset scores</button>
    <div class="confirm" id="resetConfirm" hidden>
      <span>Set every score back to 0?</span>
      <button class="btn blood" id="resetYes">Yes, reset</button>
      <button class="btn" id="resetNo">Cancel</button>
    </div>
  </div>
</section>

<script>
(() => {
  const KEY = 'gn-leaderboard-v1';
  const CHANNEL = 'gn-leaderboard';
  const $ = s => document.querySelector(s);

  const hash = location.hash.slice(1).toLowerCase();
  const MODE = hash === 'tv' || hash === 'control' ? hash : 'home';
  document.body.classList.add('mode-' + MODE);
  addEventListener('hashchange', () => location.reload());

  const baseUrl = location.href.split('#')[0];
  function openTvWindow() {
    const w = window.open(baseUrl + '#tv', 'gn-tv', 'width=1280,height=720');
    if (w) w.focus();
  }

  // ---------- State + sync ----------
  const TEAMS = [
    { name: 'Pumpkins', color: '#ff7518' },
    { name: 'Witches', color: '#8e5cc4' },
    { name: 'Zombies', color: '#a5d63a' },
    { name: 'Ghosts', color: '#efe6cf' },
  ];
  // teamOf maps player id -> team index; missing means sitting out.
  const blank = () => ({ rev: 0, nextId: 1, players: [], undo: [], last: null, roundMode: 'solo', teamCount: 2, teamOf: {} });
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.players)) return Object.assign(blank(), s);
    } catch (e) {}
    return null;
  }
  let state = load() || blank();
  let render = () => {};
  let onPing = () => {};

  const bc = 'BroadcastChannel' in window ? new BroadcastChannel(CHANNEL) : null;

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    if (bc) bc.postMessage({ type: 'state', state });
  }

  // Every score/player change snapshots the player list so Undo can restore it.
  function commit(label, mutate, last) {
    state.undo.push({ label, players: JSON.parse(JSON.stringify(state.players)) });
    if (state.undo.length > 200) state.undo.shift();
    mutate(state.players);
    state.rev++;
    state.last = Object.assign({ type: 'edit' }, last, { rev: state.rev });
    persist();
    render(true);
  }

  // Settings changes (round type, teams) sync but aren't undo steps.
  function setMeta(mutate) {
    mutate(state);
    state.rev++;
    state.last = { type: 'meta', rev: state.rev };
    persist();
    render(true);
  }

  function undo() {
    const u = state.undo.pop();
    if (!u) return;
    state.players = u.players;
    state.rev++;
    state.last = { type: 'undo', rev: state.rev };
    persist();
    render(true);
  }

  function receive(s) {
    if (!s || !Array.isArray(s.players) || s.rev <= state.rev) return;
    state = Object.assign(blank(), s);
    render(true);
  }

  if (bc) bc.onmessage = e => {
    const m = e.data || {};
    if (m.type === 'state') receive(m.state);
    else if (m.type === 'ping') onPing();
  };
  // Fallback sync: storage events + a slow poll, in case a message is missed.
  addEventListener('storage', e => {
    if (e.key !== KEY || !e.newValue) return;
    try { receive(JSON.parse(e.newValue)); } catch (_) {}
  });
  setInterval(() => { const s = load(); if (s && s.rev > state.rev) receive(s); }, 2000);

  // Competition ranking: ties share a rank (1, 1, 3).
  function ranked() {
    const arr = state.players.map(p => ({ ...p })).sort((a, b) => b.score - a.score || a.id - b.id);
    let r = 0;
    arr.forEach((p, i) => {
      if (i === 0 || p.score !== arr[i - 1].score) r = i + 1;
      p.rank = r;
    });
    return arr;
  }

  // ---------- Home ----------
  if (MODE === 'home') {
    $('#openTv').onclick = openTvWindow;
    $('#openControl').onclick = () => { location.hash = 'control'; };
  }

  // ---------- Control ----------
  if (MODE === 'control') {
    const list = $('#plist');
    const rowEls = new Map();
    let lastPing = 0;

    function updStatus() {
      const on = Date.now() - lastPing < 5000;
      const el = $('#tvStatus');
      el.classList.toggle('on', on);
      el.textContent = on ? 'TV connected' : 'TV not detected';
    }
    onPing = () => { lastPing = Date.now(); updStatus(); };
    setInterval(updStatus, 1000);

    $('#openTv2').onclick = openTvWindow;
    $('#undoBtn').onclick = undo;
    addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey &&
          document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        undo();
      }
    });

    $('#addForm').onsubmit = e => {
      e.preventDefault();
      const inp = $('#newName');
      const name = inp.value.trim().slice(0, 30);
      if (!name) { inp.value = ''; return; }
      commit('Add ' + name, ps => ps.push({ id: state.nextId++, name, score: 0 }));
      inp.value = '';
      inp.focus();
    };

    // One undo step per award, even when a whole team scores.
    function award(ids, delta, label, team) {
      const ps = state.players.filter(x => ids.includes(x.id));
      if (!ps.length) return;
      commit(label, () => ps.forEach(p => { p.score += delta; }),
        { type: 'score', ids: ps.map(p => p.id), delta, team });
      ps.forEach(p => {
        const sc = rowEls.get(p.id)?.querySelector('.pscore');
        if (sc) { sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }
      });
    }
    function scoreBy(id, delta) {
      const p = state.players.find(x => x.id === id);
      if (!p) return;
      award([id], delta, delta > 0 ? `${p.name} won (+1)` : `−1 ${p.name}`);
    }
    const teamMembers = t => state.players.filter(p => state.teamOf[p.id] === t);
    function teamWins(t) {
      const ms = teamMembers(t);
      award(ms.map(p => p.id), 1, `${TEAMS[t].name} won (+1 each)`, TEAMS[t].name);
    }

    document.querySelectorAll('#modeSeg button').forEach(b => {
      b.onclick = () => setMeta(s => { s.roundMode = b.dataset.mode; });
    });
    document.querySelectorAll('.tc').forEach(b => {
      b.onclick = () => setMeta(s => {
        s.teamCount = +b.dataset.n;
        for (const id in s.teamOf) if (s.teamOf[id] >= s.teamCount) delete s.teamOf[id];
      });
    });
    $('#shuffleBtn').onclick = () => setMeta(s => {
      const ids = s.players.map(p => p.id);
      for (let i = ids.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
      s.teamOf = {};
      ids.forEach((id, i) => { s.teamOf[id] = i % s.teamCount; });
    });

    function makeRow(id) {
      const el = document.createElement('div');
      el.className = 'player';
      el.innerHTML =
        '<div class="pname"><span class="prank"></span>' +
        '<input class="text name-in" maxlength="30" aria-label="Player name" title="Click to rename"></div>' +
        '<div class="pscore"></div>' +
        '<div class="pbtns">' +
        '<button class="minus solo-only" data-d="-1" title="Take a point back">−1</button>' +
        '<button class="btn orange win solo-only" data-d="1">Won +1</button>' +
        '<div class="chips team-only"></div>' +
        '<button class="rm" title="Remove player">✕</button></div>';
      const cur = () => state.players.find(x => x.id === id);
      const chips = el.querySelector('.chips');
      TEAMS.forEach((t, i) => {
        const c = document.createElement('button');
        c.className = 'chip';
        c.dataset.t = i;
        c.style.background = t.color;
        if (i === 1) c.style.color = '#fff';
        c.textContent = t.name;
        chips.appendChild(c);
      });
      const out = document.createElement('button');
      out.className = 'chip out';
      out.dataset.t = '-1';
      out.textContent = 'Out';
      out.title = 'Sitting out';
      chips.appendChild(out);
      chips.querySelectorAll('.chip').forEach(c => {
        c.onclick = () => setMeta(s => {
          const t = +c.dataset.t;
          if (t < 0) delete s.teamOf[id]; else s.teamOf[id] = t;
        });
      });
      const inp = el.querySelector('.name-in');
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') inp.blur();
        if (e.key === 'Escape') { inp.value = cur()?.name || ''; inp.blur(); }
      });
      inp.addEventListener('change', () => {
        const p = cur();
        if (!p) return;
        const v = inp.value.trim().slice(0, 30);
        if (!v || v === p.name) { inp.value = p.name; return; }
        commit('Rename ' + p.name, () => { p.name = v; });
      });
      el.querySelectorAll('[data-d]').forEach(b => { b.onclick = () => scoreBy(id, +b.dataset.d); });
      el.querySelector('.rm').onclick = () => {
        const p = cur();
        if (!p) return;
        commit('Remove ' + p.name, ps => {
          const i = ps.findIndex(x => x.id === id);
          if (i >= 0) ps.splice(i, 1);
        });
      };
      return el;
    }

    render = () => {
      const ranks = new Map(ranked().map(p => [p.id, p.rank]));
      const seen = new Set();
      state.players.forEach((p, i) => {
        let el = rowEls.get(p.id);
        if (!el) { el = makeRow(p.id); rowEls.set(p.id, el); }
        // Only move nodes that are out of place, so a focused name input keeps focus.
        if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null);
        seen.add(p.id);
        const inp = el.querySelector('.name-in');
        if (document.activeElement !== inp) inp.value = p.name;
        el.querySelector('.pscore').textContent = p.score;
        const rk = el.querySelector('.prank');
        rk.textContent = '#' + ranks.get(p.id);
        rk.classList.toggle('first', ranks.get(p.id) === 1 && p.score > 0);
        el.querySelectorAll('.chip').forEach(c => {
          const t = +c.dataset.t;
          c.hidden = t >= state.teamCount;
          c.classList.toggle('on', t < 0 ? state.teamOf[p.id] == null : state.teamOf[p.id] === t);
        });
      });
      rowEls.forEach((el, id) => { if (!seen.has(id)) { el.remove(); rowEls.delete(id); } });
      $('#emptyC').style.display = state.players.length ? 'none' : 'block';

      const team = state.roundMode === 'team';
      document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === state.roundMode));
      document.querySelectorAll('.solo-only').forEach(e => { e.style.display = team ? 'none' : ''; });
      document.querySelectorAll('.team-only').forEach(e => { e.style.display = team ? '' : 'none'; });
      $('#modeHint').textContent = team
        ? 'Put each player on a team, then tap the team that won. Everyone on it gets 1 point.'
        : 'Tap "Won +1" on whoever won the round. Use −1 to fix a mistake.';
      $('#teamPanel').style.display = team && state.players.length ? '' : 'none';
      document.querySelectorAll('.tc').forEach(b => b.classList.toggle('on', +b.dataset.n === state.teamCount));
      const wb = $('#winBtns');
      wb.innerHTML = '';
      for (let t = 0; t < state.teamCount; t++) {
        const ms = teamMembers(t);
        const b = document.createElement('button');
        b.className = 'winbtn';
        b.dataset.team = t;
        b.style.background = TEAMS[t].color;
        if (t === 1) b.style.color = '#fff';
        b.disabled = !ms.length;
        b.append(`${TEAMS[t].name} won`);
        const sm = document.createElement('small');
        sm.textContent = ms.length ? ms.map(p => p.name).join(', ') : 'nobody on this team';
        b.appendChild(sm);
        b.onclick = () => teamWins(t);
        wb.appendChild(b);
      }

      const u = state.undo[state.undo.length - 1];
      $('#undoBtn').disabled = !u;
      $('#undoLbl').textContent = u ? u.label : 'nothing to undo';
      $('#resetBtn').disabled = !state.players.some(p => p.score !== 0);
    };

    const hideConfirm = () => { $('#resetConfirm').hidden = true; $('#resetBtn').hidden = false; };
    $('#resetBtn').onclick = () => { $('#resetBtn').hidden = true; $('#resetConfirm').hidden = false; $('#resetNo').focus(); };
    $('#resetNo').onclick = hideConfirm;
    $('#resetYes').onclick = () => { commit('Reset scores', ps => ps.forEach(p => { p.score = 0; })); hideConfirm(); };

    render();
  }

  // ---------- TV ----------
  if (MODE === 'tv') {
    const board = $('#board');
    const rowEls = new Map();
    let prevLeaders = null;
    let celebrateTimer = 0;

    if (bc) { bc.postMessage({ type: 'ping' }); setInterval(() => bc.postMessage({ type: 'ping' }), 2000); }

    function layout() {
      const n = Math.max(state.players.length, 1);
      const H = board.clientHeight - innerHeight * 0.01;
      const gap = Math.min(innerHeight * 0.018, (H * 0.12) / n);
      const h = Math.min(innerHeight * 0.15, (H - gap * (n - 1)) / n);
      board.style.setProperty('--rowh', h + 'px');
      board.style.setProperty('--gap', gap + 'px');
    }
    addEventListener('resize', layout);

    function makeRow() {
      const el = document.createElement('div');
      el.className = 'row';
      el.innerHTML = '<div class="rank"></div><div class="name"><span class="lantern">🎃</span><span class="tdot"></span><span class="nm"></span></div>' +
                     '<div class="score"><span class="sv"></span></div>';
      return el;
    }

    function celebrate(text, kicker, fewBats) {
      const box = $('#celebrate');
      clearTimeout(celebrateTimer);
      box.innerHTML = '';
      const b = document.createElement('div');
      b.className = 'banner';
      const sm = document.createElement('small');
      sm.textContent = kicker;
      b.append(sm, text);
      box.appendChild(b);
      // A swarm of bats flies across the screen.
      const W = innerWidth, H = innerHeight;
      for (let i = 0; i < (fewBats ? 8 : 22); i++) {
        const bat = document.createElement('div');
        bat.className = 'flybat';
        const size = H * (0.04 + Math.random() * 0.07);
        const fromLeft = Math.random() < 0.5;
        const y0 = H * (0.3 + Math.random() * 0.7), y1 = y0 - H * (0.3 + Math.random() * 0.6);
        bat.style.cssText =
          `width:${size}px;--x0:${fromLeft ? -size * 2 : W + size}px;--x1:${fromLeft ? W + size : -size * 2}px;` +
          `--y0:${y0}px;--y1:${y1}px;animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * 0.9}s`;
        bat.innerHTML = '<svg viewBox="0 0 100 50"><use href="#bat"/></svg>';
        box.appendChild(bat);
      }
      celebrateTimer = setTimeout(() => { box.innerHTML = ''; }, 4600);
    }

    render = live => {
      const list = ranked();
      // FLIP step 1: remember where every row is right now.
      const first = new Map();
      rowEls.forEach((el, id) => first.set(id, el.getBoundingClientRect().top));

      const seen = new Set();
      const fresh = new Set();
      list.forEach((p, i) => {
        let el = rowEls.get(p.id);
        if (!el) { el = makeRow(); rowEls.set(p.id, el); fresh.add(p.id); }
        if (board.children[i] !== el) board.insertBefore(el, board.children[i] || null);
        seen.add(p.id);
        el.dataset.rank = p.rank;
        el.dataset.id = p.id;
        el.querySelector('.rank').textContent = p.rank;
        el.querySelector('.nm').textContent = p.name;
        const dot = el.querySelector('.tdot');
        const t = state.roundMode === 'team' ? state.teamOf[p.id] : null;
        dot.classList.toggle('show', t != null && t < state.teamCount);
        if (t != null && TEAMS[t]) dot.style.background = TEAMS[t].color;
        const sv = el.querySelector('.sv');
        if (sv.textContent !== String(p.score)) {
          if (!fresh.has(p.id)) { sv.classList.remove('bump'); void sv.offsetWidth; sv.classList.add('bump'); }
          sv.textContent = p.score;
        }
        el.classList.toggle('leader', p.rank === 1 && p.score > 0);
      });
      rowEls.forEach((el, id) => { if (!seen.has(id)) { el.remove(); rowEls.delete(id); } });
      $('#tvEmpty').hidden = list.length > 0;
      layout();

      // FLIP steps 2-4: jump rows back to their old spot, then let them slide home.
      const moved = [];
      list.forEach(p => {
        const el = rowEls.get(p.id);
        if (fresh.has(p.id)) {
          el.style.transition = 'none';
          el.style.opacity = '0';
          el.style.transform = 'translateX(-8vw) scale(.96)';
          moved.push(el);
          return;
        }
        const dy = first.get(p.id) - el.getBoundingClientRect().top;
        if (Math.abs(dy) > 0.5) {
          el.style.transition = 'none';
          el.style.transform = `translateY(${dy}px)`;
          moved.push(el);
        }
      });
      if (moved.length) {
        void board.offsetHeight;
        moved.forEach(el => { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; });
      }

      // "+1" pop and a flash on everyone who just scored.
      const L = state.last;
      const isScore = live && L && L.rev === state.rev && L.type === 'score';
      if (isScore) for (const id of L.ids || []) {
        const el = rowEls.get(id);
        if (!el) continue;
        const pop = document.createElement('span');
        pop.className = 'pop' + (L.delta < 0 ? ' neg' : '');
        pop.textContent = (L.delta > 0 ? '+' : '−') + Math.abs(L.delta);
        el.querySelector('.score').appendChild(pop);
        pop.addEventListener('animationend', () => pop.remove());
        el.classList.remove('flash', 'flash-neg');
        void el.offsetWidth;
        el.classList.add('flash');
        if (L.delta < 0) el.classList.add('flash-neg');
      }

      // Celebrate when someone new reaches 1st (or a team wins).
      const leaders = list.filter(p => p.rank === 1 && p.score > 0);
      if (isScore && L.delta > 0 && prevLeaders) {
        const newcomers = leaders.filter(p => !prevLeaders.has(p.id));
        // Breaking a tie for 1st also counts as taking the lead.
        const brokeTie = leaders.length === 1 && prevLeaders.size > 1 && L.ids.includes(leaders[0].id);
        if (newcomers.length || brokeTie) {
          const names = (leaders.length > 1 || brokeTie ? leaders : newcomers).map(p => p.name).join(' & ');
          celebrate('🎃 ' + names, leaders.length > 1 ? 'Tied for 1st' : 'New leader');
        } else if (L.team) {
          celebrate(L.team + ' win', '+1 each', true);
        }
      }
      prevLeaders = new Set(leaders.map(p => p.id));
    };

    // Fullscreen + auto-hiding button/cursor.
    const fsBtn = $('#fsBtn');
    const toggleFs = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    };
    fsBtn.onclick = toggleFs;
    board.addEventListener('dblclick', toggleFs);
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
      setTimeout(layout, 50);
    });
    let idleTimer = 0;
    const wake = () => {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
    };
    addEventListener('mousemove', wake);
    wake();

    render(false);
  }
})();
</script>
</body>
</html>
