<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tej Jogani</title>
<style>
  :root {
    --bg: #faf8f4;
    --bg-panel: #ffffff;
    --ink: #1c1a17;
    --ink-soft: #6b665e;
    --line: #e7e2d8;
    --accent: #7a8a5c;
    --accent-soft: #eef1e6;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  main { max-width: 480px; width: 100%; }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 34px;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  p.sub { margin: 0 0 32px; color: var(--ink-soft); font-size: 14px; }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  a.card {
    display: block;
    padding: 18px 20px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  a.card:hover { border-color: var(--accent); background: var(--accent-soft); }
  a.card .title { font-family: var(--serif); font-size: 19px; margin: 0 0 4px; }
  a.card .desc { font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>
  <main>
    <h1>Tej Jogani</h1>
    <p class="sub">Small tools, live in production.</p>
    <div class="cards">
      <a class="card" href="/recipes/">
        <p class="title">🍲 Recipes</p>
        <p class="desc">Recipes, todos, budget, and texts — a little home dashboard.</p>
      </a>
      <a class="card" href="/trading/">
        <p class="title">📈 Trading Research</p>
        <p class="desc">Algo notes, strategy backtests, and a market glossary.</p>
      </a>
    </div>
  </main>
</body>
</html>
